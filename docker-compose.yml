services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clinicqueue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clinicqueue_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run only on first start (when the data volume is empty).
      # 01: base schema (schema-only, no data) | 01a: fixed reference data (roles, user_statuses)
      # | 02: refresh_tokens | 03: post-DDL migrations (columns, functions, etc.) | 04: ad campaigns | 05: visit plans
      - ./clinicqueue-DDL.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/init/01a-reference-data.sql:/docker-entrypoint-initdb.d/01a-reference-data.sql:ro
      - ./apps/api/db/migrations/001_refresh_tokens.sql:/docker-entrypoint-initdb.d/02-refresh-tokens.sql:ro
      - ./docker/init/03-migrations.sql:/docker-entrypoint-initdb.d/03-migrations.sql:ro
      - ./docker/init/04-ad-campaigns.sql:/docker-entrypoint-initdb.d/04-ad-campaigns.sql:ro
      - ./docker/init/05-visit-plans.sql:/docker-entrypoint-initdb.d/05-visit-plans.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinicqueue_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API + Web UI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicqueue_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      CORS_SUBNETS: ${CORS_SUBNETS:-}
      CORS_TRUST_LAN: ${CORS_TRUST_LAN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persist TTS audio cache across container restarts
      - tts_cache:/app/apps/api/cache
      # Persist uploaded board ad media (video/images) across container restarts
      - board_media:/app/apps/api/media
      # UI precompilado: monta el build del host para que un `git pull` +
      # `docker compose restart api` refleje la nueva version sin rebuild.
      - ./apps/web/build:/app/apps/web/build:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── pgAdmin ──────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: clinicqueue_pgadmin
    restart: unless-stopped
    ports:
      # Loopback-only: pgAdmin has full write access to the database and this
      # runs on the clinic's shared LAN — it should only be reachable from the
      # host machine itself (e.g. via SSH tunnel), never directly from the network.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the postgres connection so it appears on first login
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
  tts_cache:
  board_media:
